name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  service:
    name: Service and shared interfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/requirements*.txt
      - run: python -m pip install -r service/requirements-dev.txt
      - run: python -m pytest -q

  contracts:
    name: Cover contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge fmt --check
      - run: forge build
      - run: forge test

  registries:
    name: ERC-8004 reference
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/lib/erc-8004-contracts
    # Upstream validates these URLs during compile. No remote calls or keys.
    env:
      SEPOLIA_RPC_URL: http://127.0.0.1:8545
      MAINNET_RPC_URL: http://127.0.0.1:8545
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: contracts/lib/erc-8004-contracts/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx hardhat compile
      - run: npm test
